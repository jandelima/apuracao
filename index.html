<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apuração 2026</title>
<style>
  :root {
    --bg: #f4f5f8; --card: #ffffff; --line: #e2e5ec; --text: #161a22; --muted: #646c7d;
    --flavio: #1f5fc9; --lula: #d42f2f; --other: #8a909c; --prog: #1f9d5c;
    --track: #e7e9ef; --empty: #dfe2e8; --flash: rgba(255, 200, 0, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1115; --card: #181b22; --line: #2a2f3a; --text: #e8eaf0; --muted: #8b93a5;
      --flavio: #4a86ec; --lula: #ef5350; --other: #6d7381; --prog: #3fb67a;
      --track: #262a33; --empty: #232730; --flash: rgba(255, 200, 0, .22);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  .num { font-variant-numeric: tabular-nums; }
  .flash { animation: flash 1.2s ease-out; border-radius: 4px; }
  @keyframes flash { from { background: var(--flash); } to { background: transparent; } }

  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0; }
  .live { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .live i { width: 9px; height: 9px; border-radius: 50%; background: var(--prog); animation: pulse 2s infinite; }
  .live.off i { background: var(--lula); animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .live b { color: var(--text); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; margin-bottom: 18px; }
  h2 { font-size: 17px; margin: 0 0 16px; }

  /* Placar */
  .duel { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .cand { display: flex; align-items: center; gap: 16px; }
  .cand.r { flex-direction: row-reverse; text-align: right; }
  .photo { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; object-position: top;
           background: var(--track); border: 4px solid; flex: none; }
  .f .photo { border-color: var(--flavio); } .l .photo { border-color: var(--lula); }
  .cand .nm { font-size: 17px; font-weight: 600; }
  .cand .pct { font-size: 48px; line-height: 1.05; font-weight: 800; }
  .cand .vt { font-size: 15px; color: var(--muted); }
  .f .pct { color: var(--flavio); } .l .pct { color: var(--lula); }
  .split { position: relative; display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--track); margin-top: 20px; }
  .split div { transition: width .8s ease; }
  .split .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: var(--card); }
  .diff { text-align: center; margin-top: 12px; font-size: 17px; }
  .diff b { font-size: 20px; }
  .verdict { margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--track); font-weight: 600; text-align: center; }
  .verdict.win { background: color-mix(in srgb, var(--prog) 18%, transparent); }
  .brasil { margin-top: 20px; }
  .brasil .top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .brasil .top b { font-size: 22px; }

  .bar { height: 12px; border-radius: 6px; background: var(--track); overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--prog); transition: width .8s ease, background .8s; }

  /* Outros candidatos */
  .others { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px 32px; }
  .oc { display: flex; align-items: center; gap: 12px; }
  .oc img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; object-position: top; background: var(--track); flex: none; }
  .oc .n { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .oc .p { font-weight: 700; }

  /* Regiões */
  .rg { display: grid; grid-template-columns: 120px minmax(0, 1fr) 84px 230px; grid-template-areas: "nm bar pc who";
        align-items: center; gap: 4px 18px; padding: 9px 0; }
  .rg .nm { grid-area: nm; font-weight: 700; white-space: nowrap; }
  .rg .bar { grid-area: bar; }
  .rg .pc { grid-area: pc; font-size: 20px; font-weight: 800; text-align: right; }
  .rg .who { grid-area: who; margin: 0; }
  .who { margin-top: 8px; font-size: 15px; }
  .who .fl { color: var(--flavio); font-weight: 600; } .who .lu { color: var(--lula); font-weight: 600; }
  .who .x { color: var(--muted); }

  /* Estados */
  .states { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .head h2 { margin: 0; }
  .head h2 span { color: var(--muted); font-weight: 500; }

  .map { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
  .tile { aspect-ratio: 1; border-radius: 8px; background: var(--empty); color: var(--muted);
          display: flex; align-items: center; justify-content: center;
          font-size: 15px; font-weight: 700; transition: background .8s; cursor: default; }
  .tile.lead { color: #fff; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 16px; font-size: 14px; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  .sort { display: flex; gap: 4px; }
  .sort button { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
                 background: transparent; color: var(--muted); cursor: pointer; }
  .sort button.on { background: var(--text); color: var(--card); border-color: var(--text); }
  .list { columns: 2 260px; column-gap: 32px; }
  .reg { break-inside: avoid; margin-bottom: 8px; }
  .reg h3 { font-size: 14px; color: var(--muted); margin: 6px 0 2px; font-weight: 600; }
  .uf { break-inside: avoid; display: grid; grid-template-columns: 34px 1fr 66px; align-items: center; gap: 12px; padding: 7px 0; }
  .uf .sg { font-weight: 700; }
  .uf .pc { text-align: right; }
  .uf.done .pc { color: var(--prog); font-weight: 700; }

  @media (max-width: 820px) {
    .states { grid-template-columns: 1fr; }
    .map { max-width: 440px; margin: 0 auto; }
    .rg { grid-template-columns: 1fr auto; grid-template-areas: "nm pc" "bar bar" "who who"; gap: 6px 12px; padding: 8px 0; }
  }
  @media (max-width: 560px) {
    main { padding: 16px 12px 32px; }
    h1 { font-size: 19px; }
    header { margin-bottom: 14px; }
    .card { padding: 16px; border-radius: 12px; margin-bottom: 14px; }

    .duel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cand, .cand.r { flex-direction: column; text-align: center; gap: 6px; }
    .photo { width: 80px; height: 80px; border-width: 3px; }
    .cand .nm { font-size: 15px; }
    .cand .pct { font-size: 38px; }
    .cand .vt { font-size: 14px; }
    .split { height: 14px; margin-top: 16px; }
    .diff { font-size: 16px; }
    .diff b { font-size: 18px; }
    .verdict { font-size: 15px; padding: 10px 12px; }

    .others { grid-template-columns: 1fr; gap: 10px; }

    .map { gap: 4px; }
    .tile { border-radius: 7px; font-size: 13px; }

    .sort { width: 100%; }
    .sort button { flex: 1; padding: 9px 6px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Apuração · Presidente 2026</h1>
    <span class="live" id="live"><i></i>Atualizado às <b class="num" id="tse">—</b></span>
  </header>

  <div class="card">
    <div class="duel">
      <div class="cand f">
        <img class="photo" id="fph" alt="">
        <div><div class="nm">Flávio Bolsonaro</div><div class="pct num" id="fp">—</div><div class="vt num" id="fv"></div></div>
      </div>
      <div class="cand l r">
        <img class="photo" id="lph" alt="">
        <div><div class="nm">Lula</div><div class="pct num" id="lp">—</div><div class="vt num" id="lv"></div></div>
      </div>
    </div>
    <div class="split"><div id="fb" style="background:var(--flavio);width:50%"></div><div id="lb" style="background:var(--lula);width:50%"></div><span class="mid"></span></div>
    <div class="diff num" id="diff">&nbsp;</div>
    <div class="verdict" id="verdict">Carregando…</div>
    <div class="brasil">
      <div class="top"><span>Seções apuradas no Brasil</span><b class="num" id="np">—</b></div>
      <div class="bar"><div id="nb"></div></div>
    </div>
  </div>

  <div class="card">
    <h2>Outros candidatos</h2>
    <div class="others" id="others"></div>
  </div>

  <div class="card">
    <h2>Seções apuradas por região</h2>
    <div class="regs" id="regs"></div>
  </div>

  <div class="states">
    <div class="card">
      <h2>Quem lidera em cada estado</h2>
      <div class="map" id="map"></div>
      <div class="legend">
        <span><i style="background:var(--flavio)"></i>Flávio</span>
        <span><i style="background:var(--lula)"></i>Lula</span>
        <span>Cor mais forte = mais apurado</span>
      </div>
    </div>
    <div class="card">
      <div class="head">
        <h2>Estados <span>· <b class="num" id="done">0</b> de 27 concluídos</span></h2>
        <div class="sort" id="sort">
          <button data-k="nome">A–Z</button>
          <button data-k="regiao">Região</button>
          <button data-k="pct">% apurado</button>
        </div>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>
</main>

<script>
const BASE = "https://resultados.tse.jus.br/oficial/ele2026/6257";
const INTERVAL = 30;
const FLAVIO = "22", LULA = "13";

// sigla, nome, região, coluna e linha no mapa em quadradinhos
const UFS = [
  ["rr","Roraima","Norte",1,0], ["ap","Amapá","Norte",3,0],
  ["am","Amazonas","Norte",1,1], ["pa","Pará","Norte",2,1], ["ma","Maranhão","Nordeste",3,1], ["ce","Ceará","Nordeste",4,1], ["rn","Rio Grande do Norte","Nordeste",5,1],
  ["ac","Acre","Norte",0,2], ["ro","Rondônia","Norte",1,2], ["mt","Mato Grosso","Centro-Oeste",2,2], ["to","Tocantins","Norte",3,2], ["pi","Piauí","Nordeste",4,2], ["pb","Paraíba","Nordeste",5,2],
  ["ms","Mato Grosso do Sul","Centro-Oeste",2,3], ["go","Goiás","Centro-Oeste",3,3], ["ba","Bahia","Nordeste",4,3], ["pe","Pernambuco","Nordeste",5,3],
  ["sp","São Paulo","Sudeste",2,4], ["df","Distrito Federal","Centro-Oeste",3,4], ["mg","Minas Gerais","Sudeste",4,4], ["al","Alagoas","Nordeste",5,4],
  ["pr","Paraná","Sul",2,5], ["rj","Rio de Janeiro","Sudeste",3,5], ["es","Espírito Santo","Sudeste",4,5], ["se","Sergipe","Nordeste",5,5],
  ["sc","Santa Catarina","Sul",2,6],
  ["rs","Rio Grande do Sul","Sul",2,7],
].map(([uf, nome, regiao, x, y]) => ({ uf, nome, regiao, x, y, pct: 0 }));
const REGIOES = ["Norte", "Nordeste", "Centro-Oeste", "Sudeste", "Sul"];

const $ = id => document.getElementById(id);
const num = s => parseFloat(String(s).replace(",", "."));
const fmt = n => n.toLocaleString("pt-BR");
const pct1 = x => x.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const pct2 = x => x.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nome = c => c.n === FLAVIO ? "Flávio Bolsonaro" : c.n === LULA ? "Lula"
  : c.nmu.toLowerCase().replace(/(^|\s)(\S)/g, (m, sp, ch) => sp + ch.toUpperCase()).replace(/ (D[aeo]s?) /g, (m, w) => " " + w.toLowerCase() + " ");
const foto = sq => `${BASE}/fotos/br/${sq}.jpeg`;
const colorOf = n => n === FLAVIO ? "var(--flavio)" : n === LULA ? "var(--lula)" : "var(--other)";
const versus = (f, l) => `<span class="fl">Flávio ${pct1(f)}%</span> <span class="x">×</span> <span class="lu">Lula ${pct1(l)}%</span>`;

// Troca o texto e pisca se o valor mudou
function set(el, text) {
  if (el.textContent === text) return;
  const had = el.textContent.trim() !== "" && el.textContent !== "—";
  el.textContent = text;
  if (had) { el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
}
function setHTML(el, html) {
  if (el.innerHTML !== html) el.innerHTML = html;
}

// Monta mapa e lista uma vez
const map = $("map");
for (const s of UFS) {
  s.tile = document.createElement("div");
  s.tile.className = "tile";
  s.tile.style.gridColumn = s.x + 1;
  s.tile.style.gridRow = s.y + 1;
  s.tile.textContent = s.uf.toUpperCase();
  s.tile.title = s.nome;
  map.appendChild(s.tile);

  s.row = document.createElement("div");
  s.row.className = "uf";
  s.row.title = s.nome;
  s.row.innerHTML = `<span class="sg">${s.uf.toUpperCase()}</span><div class="bar"><div></div></div><span class="pc num">—</span>`;
}

let order = "nome";
try { order = localStorage.getItem("ordem") || "nome"; } catch (e) {}

function renderList() {
  const list = $("list");
  list.replaceChildren();
  document.querySelectorAll("#sort button").forEach(b => b.classList.toggle("on", b.dataset.k === order));
  if (order === "regiao") {
    for (const r of REGIOES) {
      const g = document.createElement("div");
      g.className = "reg";
      g.innerHTML = `<h3>${r}</h3>`;
      UFS.filter(s => s.regiao === r).sort((a, b) => a.uf.localeCompare(b.uf)).forEach(s => g.appendChild(s.row));
      list.appendChild(g);
    }
  } else {
    const sorted = [...UFS].sort(order === "pct" ? (a, b) => b.pct - a.pct : (a, b) => a.uf.localeCompare(b.uf));
    sorted.forEach(s => list.appendChild(s.row));
  }
}
$("sort").addEventListener("click", e => {
  const k = e.target.dataset?.k;
  if (!k) return;
  order = k;
  try { localStorage.setItem("ordem", k); } catch (e) {}
  renderList();
});
renderList();

async function get(abr) {
  const r = await fetch(`${BASE}/dados/${abr}/${abr}-c0001-e006257-u.json`, { cache: "no-store" });
  if (!r.ok) throw new Error(`${abr.toUpperCase()}: HTTP ${r.status}`);
  return r.json();
}

function cands(d) {
  const out = [];
  for (const a of d.carg[0].agr)
    for (const p of a.par)
      for (const c of p.cand) out.push(c);
  return out.sort((a, b) => +b.vap - +a.vap);
}

function updateBrasil(br) {
  const all = cands(br);
  const f = all.find(c => c.n === FLAVIO), l = all.find(c => c.n === LULA);
  const fv = +f.vap, lv = +l.vap, tot = fv + lv || 1;

  if (!$("fph").src) { $("fph").src = foto(f.sqcand); $("lph").src = foto(l.sqcand); }
  set($("fp"), f.pvap + "%");
  set($("lp"), l.pvap + "%");
  set($("fv"), fmt(fv) + " votos");
  set($("lv"), fmt(lv) + " votos");
  $("fb").style.width = (fv / tot * 100) + "%";
  $("lb").style.width = (lv / tot * 100) + "%";

  // Diferença de votos entre os dois
  const d = Math.abs(fv - lv);
  setHTML($("diff"), fv === lv ? "Empate"
    : `${fv > lv ? "Flávio" : "Lula"} está <b>${fmt(d)} votos</b> à frente`);

  set($("np"), br.s.pst + "%");
  $("nb").style.width = num(br.s.pst) + "%";
  set($("tse"), br.hg.slice(0, 5));

  // Situação: eleito / 1º turno / 2º turno
  const v = $("verdict");
  const eleito = all.find(c => c.e === "s");
  const [a, b] = all;
  let msg;
  if (eleito) msg = `🏆 ${nome(eleito)} está eleito presidente`;
  else if (num(a.pvap) > 50) msg = `Se a apuração parasse agora, ${nome(a)} venceria no 1º turno`;
  else msg = `Se a apuração parasse agora, haveria 2º turno entre ${nome(a)} e ${nome(b)}`;
  set(v, msg);
  v.classList.toggle("win", !!eleito);

  // Outros candidatos
  const rest = all.filter(c => c.n !== FLAVIO && c.n !== LULA);
  const box = $("others");
  if (box.children.length !== rest.length) {
    box.innerHTML = rest.map(() => `<div class="oc"><img alt="" loading="lazy"><span class="n"></span><span class="p num"></span></div>`).join("");
  }
  rest.forEach((c, i) => {
    const el = box.children[i];
    const img = el.querySelector("img");
    if (img.getAttribute("src") !== foto(c.sqcand)) img.src = foto(c.sqcand);
    el.querySelector(".n").textContent = nome(c);
    el.title = `${nome(c)} · ${fmt(+c.vap)} votos`;
    set(el.querySelector(".p"), c.pvap + "%");
  });
}

function updateUF(s, d) {
  s.d = d;
  s.pct = num(d.s.pst);
  const all = cands(d);
  const lead = +all[0].vap > 0 ? all[0] : null;
  const col = lead ? colorOf(lead.n) : "var(--track)";
  const f = all.find(c => c.n === FLAVIO), l = all.find(c => c.n === LULA);
  const info = `${s.nome}: ${d.s.pst}% apurado` + (lead ? ` · Flávio ${f.pvap}% × Lula ${l.pvap}%` : "");

  const bar = s.row.querySelector(".bar div");
  bar.style.width = s.pct + "%";
  bar.style.background = col;
  set(s.row.querySelector(".pc"), pct1(s.pct) + "%");
  s.row.classList.toggle("done", s.pct >= 100);
  s.row.title = info;

  // Intensidade da cor no mapa segue o % apurado (mínimo 55% para o texto branco ficar legível)
  if (lead) {
    const k = Math.round(55 + 45 * s.pct / 100);
    s.tile.style.background = `color-mix(in srgb, ${col} ${k}%, var(--empty))`;
    s.tile.classList.add("lead");
  } else {
    s.tile.style.background = "";
    s.tile.classList.remove("lead");
  }
  s.tile.title = info;
}

// Soma seções e votos dos estados de cada região,
// assim estados maiores pesam mais (SP pesa mais que ES no Sudeste)
function updateRegioes() {
  const box = $("regs");
  if (!box.children.length) {
    box.innerHTML = REGIOES.map(r =>
      `<div class="rg"><span class="nm">${r}</span><div class="bar"><div></div></div>` +
      `<span class="pc num">—</span><div class="who num">&nbsp;</div></div>`).join("");
  }
  REGIOES.forEach((r, i) => {
    const ss = UFS.filter(s => s.regiao === r);
    if (ss.some(s => !s.d)) return;   // ainda falta algum estado
    let st = 0, ts = 0, vv = 0;
    const votos = {};
    for (const { d } of ss) {
      st += +d.s.st; ts += +d.s.ts; vv += +d.v.vv;
      for (const c of cands(d)) votos[c.n] = (votos[c.n] || 0) + +c.vap;
    }
    const p = ts ? st / ts * 100 : 0;
    const lead = Object.keys(votos).sort((a, b) => votos[b] - votos[a])[0];
    const hasVotes = vv > 0 && votos[lead] > 0;

    const el = box.children[i];
    const bar = el.querySelector(".bar div");
    bar.style.width = p + "%";
    bar.style.background = hasVotes ? colorOf(lead) : "var(--track)";
    set(el.querySelector(".pc"), pct2(p) + "%");
    el.title = `${fmt(st)} de ${fmt(ts)} seções apuradas`;
    setHTML(el.querySelector(".who"), hasVotes
      ? versus((votos[FLAVIO] || 0) / vv * 100, (votos[LULA] || 0) / vv * 100)
      : "sem votos apurados");
  });
}

async function update() {
  const errs = [];
  try { updateBrasil(await get("br")); } catch (e) { errs.push(e.message); }

  await Promise.all(UFS.map(async s => {
    try { updateUF(s, await get(s.uf)); } catch (e) { errs.push(e.message); }
  }));

  set($("done"), String(UFS.filter(s => s.pct >= 100).length));
  updateRegioes();
  if (order === "pct") renderList();

  // Bolinha vermelha e motivo no tooltip se alguma consulta falhou
  $("live").classList.toggle("off", errs.length > 0);
  $("live").title = errs.length ? "Falha ao consultar: " + errs.join(", ") : "Consulta o TSE a cada 30 segundos";
}

update();
setInterval(update, INTERVAL * 1000);
</script>
</body>
</html>
